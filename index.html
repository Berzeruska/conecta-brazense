<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16264A" />
    <meta name="description" content="O app da cidade, feito por nós, para nós: produtores, comércio local e feirão de vizinhos." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Conecta Brazense</title>
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #16264a; color: #fff; font-family: system-ui, sans-serif; transition: opacity 0.3s ease; }
      #splash img { width: 76px; height: 76px; animation: pulsar 1.2s ease-in-out infinite; }
      #splash p { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
      #splash.saindo { opacity: 0; pointer-events: none; }
      @keyframes pulsar { 50% { transform: scale(0.92); } }
      @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
    </style>
  </head>
  <body>
    <!-- Splash enquanto o app carrega (some sozinho depois do primeiro desenho). -->
    <div id="splash" aria-hidden="true"><img src="/favicon.svg" alt="" /><p>Conecta Brazense</p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
